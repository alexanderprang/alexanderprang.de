<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Alexander Prang</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #19202a;
        --paper: #fffaf0;
        --surface: #ffffff;
        --line: #d9d2c3;
        --accent: #0b6b68;
        --accent-strong: #064d4a;
        --shadow: 0 24px 80px rgba(31, 39, 49, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 32px;
        place-items: center;
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background:
          radial-gradient(circle at 18% 12%, rgba(245, 184, 75, 0.24), transparent 28rem),
          linear-gradient(135deg, #e9f4ef 0%, var(--paper) 46%, #e8eef7 100%);
      }

      .card {
        width: min(420px, 100%);
        padding: clamp(28px, 5vw, 44px);
        text-align: center;
        border: 1px solid rgba(25, 32, 42, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: var(--shadow);
      }

      .eyebrow {
        margin: 0 0 4px;
        color: var(--accent);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(1.8rem, 5vw, 2.6rem);
        line-height: 1.05;
      }

      nav {
        display: grid;
        gap: 12px;
      }

      .menu-link {
        padding: 14px 20px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--accent-strong);
        text-decoration: none;
        font-weight: 800;
        background: var(--surface);
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .menu-link:hover {
        transform: translateY(-1px);
        border-color: var(--accent);
        background: #f2fbf8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p class="eyebrow">Willkommen</p>
      <h1>Alexander Prang</h1>

      <nav aria-label="Menü">
        <a class="menu-link" href="/games/">Zu den Spielen</a>
      </nav>
    </div>
  </body>
</html>
