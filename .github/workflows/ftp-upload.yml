name: SFTP Deploy

on:
  push:
    branches:
      - main

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Zielverzeichnis komplett leeren, damit keine alten Dateien
      # (auf keiner Ebene) übrig bleiben, bevor neu hochgeladen wird
      - name: Wipe remote target directory
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22
          script: |
            find /alexanderprang.de/httpdocs -mindepth 1 -delete

      # Dateien über SFTP hochladen
      - name: Upload files via SFTP
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22 # Standard-SFTP-Port
          source: ./ # Lokales Verzeichnis
          target: /alexanderprang.de/httpdocs # Zielverzeichnis auf dem Server
