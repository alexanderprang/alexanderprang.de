name: SFTP Deploy

on:
  push:
    branches:
      - main

jobs:
  sftp-deploy:
    runs-on: ubuntu-latest

    steps:
      # Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Spiegelt das Repo per rsync auf den Server: neue/geänderte Dateien
      # werden hochgeladen, Dateien und Ordner, die lokal nicht mehr
      # existieren, werden auf dem Server entfernt (egal auf welcher Ebene).
      - name: Mirror files via rsync over SSH
        run: |
          sudo apt-get update && sudo apt-get install -y sshpass
          sshpass -p "${{ secrets.FTP_PASSWORD }}" rsync -avz --delete \
            --exclude=".git/" --exclude=".github/" \
            -e "ssh -o StrictHostKeyChecking=no -p 22" \
            ./ "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/alexanderprang.de/httpdocs/"
